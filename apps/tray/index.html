<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Gateway Tray</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main class="container">
    <h1>LLM Gateway</h1>
    <div class="status-row" aria-live="polite">
      <span id="status-dot" class="dot" aria-hidden="true"></span>
      <span id="status-text">Checking...</span>
    </div>
    <p id="message" class="message" role="status"></p>
    <div class="actions">
      <button id="btn-start" type="button">Start Service</button>
      <button id="btn-stop" type="button">Stop Service</button>
      <button id="btn-restart" type="button">Restart Service</button>
      <button id="btn-dashboard" type="button" class="primary">Open Dashboard</button>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
